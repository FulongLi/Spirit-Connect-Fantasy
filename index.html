<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灵接幻想档案</title>
    <meta name="description" content="灵接幻想小说档案的沉浸式展示原型。" />
    <link rel="stylesheet" href="styles.css?v=20261020-1" />
  </head>
  <body data-theme="night" data-lang="zh">
    <canvas id="scene" aria-label="灵接幻想环形档案舱场景"></canvas>
    <noscript><p class="noscript-note">灵接幻想档案需要启用 JavaScript。可直接阅读：<a href="novels/dark-moon/">月球暗面</a> · <a href="novels/whale-fall/">巨鲸陨落</a></p></noscript>

    <main id="scroll-stage">
      <div class="scroll-space"></div>
    </main>

    <header class="topbar">
      <div class="brand" data-i18n="brand">灵接幻想</div>
      <nav class="nav">
        <a href="#archive-grid" data-i18n="navOverview">档案总览</a>
        <a href="#storylines" data-i18n="navStory">故事线</a>
      </nav>
      <div class="toolbar" aria-label="Display controls">
        <div class="segmented" aria-label="Language">
          <button type="button" class="is-active" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <div class="segmented" aria-label="Theme">
          <button type="button" data-mode="day">白天</button>
          <button type="button" class="is-active" data-mode="night">夜间</button>
        </div>
      </div>
    </header>

    <div class="rail" aria-hidden="true">
      <div class="rail-dot" id="rail-dot"></div>
    </div>

    <section class="chapter chapter-intro is-visible" data-chapter="intro">
      <p class="eyebrow" data-i18n="introEyebrow">另一个世界 · 叙事档案馆</p>
      <h1 data-i18n="introTitle">灵接幻想</h1>
    </section>

    <section class="chapter book-panel" data-book-panel>
      <div class="book-cover" id="book-cover">
        <span id="book-glyph">月</span>
      </div>
      <div class="book-copy">
        <p class="eyebrow" id="book-kicker">档案 I · 死在月球是知晓地球真相最快的方式</p>
        <h2 id="book-title">月球暗面</h2>
        <p id="book-description">遍览古代文明，人类像猴子一样几千年没有成长。阿卡西的海洋像雨水一样浇灌在每一位智人的颅顶，没有高一级的文明介入，就算淹死，猴子依然是猴子。</p>
        <div class="meta-row">
          <span id="book-status"></span>
          <span id="book-theme"></span>
        </div>
        <a class="primary-link" id="book-link" href="#" data-i18n="enter">进入小说档案</a>
      </div>
    </section>

    <section class="overview" id="archive-grid" aria-labelledby="archive-title">
      <div class="overview-inner">
        <p class="eyebrow" data-i18n="archiveEyebrow">档案索引</p>
        <h2 id="archive-title" data-i18n="archiveTitle">灵接幻想书卷序列</h2>
        <p class="overview-lead" data-i18n="archiveLead">
          六卷书按档案顺序排列。全文已上线的书卷可直接进入阅读，其余书卷仍在创作中。
        </p>
        <div class="archive-tabs" role="tablist" aria-label="Archive views">
          <button type="button" class="is-active" data-final-view="archive">书卷总览</button>
          <button type="button" data-final-view="storyline">故事线</button>
          <button type="button" data-final-view="graph">关系图谱</button>
        </div>
        <div class="final-view is-active" id="final-archive">
          <div class="archive-grid" id="archive-list"></div>
        </div>
        <div class="final-view" id="final-storyline">
          <div class="storyline-layout">
            <div class="story-books" id="story-book-list"></div>
            <div class="story-stage">
              <div class="story-canvas" id="storyline-canvas"></div>
              <div class="story-detail" id="storyline-detail"></div>
            </div>
          </div>
        </div>
        <div class="final-view" id="final-graph">
          <div class="graph-wrap">
            <div class="graph-chips" id="graph-chips"></div>
            <canvas id="relation-graph" class="relation-graph" aria-label="Relation graph"></canvas>
            <div class="graph-tip" data-i18n="graphTip">拖拽视图 · 悬停高亮 · 点击节点查看说明</div>
          </div>
          <div class="story-detail" id="graph-detail"></div>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <span data-i18n="footerCopy">© 2026 灵接幻想。版权所有。</span>
    </footer>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="app.js?v=20261020-1"></script>
  </body>
</html>
