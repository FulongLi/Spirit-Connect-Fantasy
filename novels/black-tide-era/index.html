<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黑潮时代 | 灵接幻想</title>
    <meta name="description" content="《黑潮时代》是《灵接幻想》的番外，讲述 CP2 先生的早年生活和黑潮经历。" />
    <link rel="stylesheet" href="../dark-moon/assets/style.css" />
  </head>
  <body class="index-page" data-theme="night" data-lang="zh">
    <header class="reader-topbar">
      <a class="reader-brand" href="../../" data-i18n="brand">灵接幻想</a>
      <nav class="reader-nav">
        <a id="archive-link" href="../../#extras" data-i18n="archive">返回番外</a>
      </nav>
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="Language">
          <button type="button" class="is-active" data-lang="zh" aria-pressed="true">中文</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="segmented" role="group" aria-label="Theme">
          <button type="button" data-mode="day" data-i18n="day" aria-pressed="false">白天</button>
          <button type="button" class="is-active" data-mode="night" data-i18n="night" aria-pressed="true">夜间</button>
        </div>
      </div>
    </header>

    <header class="reader-shell">
      <section class="book-hero" aria-labelledby="book-title">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="kicker">番外 · 筹备中</p>
          <h1 id="book-title" data-i18n="title">黑潮时代</h1>
          <p class="subtitle" data-i18n="subtitle">Black Tide Era</p>
          <p class="intro" data-i18n="intro">
            以 CP2 先生为主角，讲述他的早年生活，以及他亲历黑潮时代的故事。
          </p>
          <p data-i18n="author">李富龙 著</p>
        </div>
        <figure class="cover-stack">
          <img class="cover-zh" src="../../assets/web/BT_cn.jpg" alt="黑潮时代中文封面" />
          <img class="cover-en" src="../../assets/web/BT_en.jpg" alt="Black Tide Era English cover" />
        </figure>
      </section>
    </header>

    <main class="catalog-shell" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <p class="eyebrow" data-i18n="catalogKicker">章节索引</p>
        <h2 id="catalog-title" data-i18n="catalogTitle">中文阅读目录</h2>
      </div>
      <p data-i18n="catalogEmpty">章节尚未发布。</p>
      <ol class="chapter-list"></ol>
    </main>
    <script src="assets/reader.js"></script>
