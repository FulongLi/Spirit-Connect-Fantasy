<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>书名页_版权_献词</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #5f6368;
      --line: #d8dee8;
      --paper: #fbfbf8;
      --accent: #245f73;
      --table: #f2f6f7;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.72;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 22px 72px;
    }
    h1, h2, h3 {
      line-height: 1.25;
      letter-spacing: 0;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0 0 22px;
      color: #18333d;
    }
    h2 {
      margin-top: 46px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--accent);
      font-size: 1.45rem;
    }
    h3 {
      margin-top: 30px;
      font-size: 1.12rem;
    }
    p, li {
      font-size: 1rem;
    }
    p {
      margin: 12px 0;
    }
    ul {
      margin: 10px 0 18px;
      padding-left: 1.4rem;
    }
    code {
      background: #e9eef0;
      padding: 0.1rem 0.32rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0 26px;
      font-size: 0.94rem;
      background: white;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: top;
    }
    th {
      background: var(--table);
      text-align: left;
      color: #18333d;
    }
    .numbered span {
      color: var(--accent);
      font-weight: 700;
    }
    .system-line {
      color: #37525c;
      background: #eef5f6;
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
    }
    @media (max-width: 760px) {
      main {
        padding: 32px 16px 56px;
      }
      h1 {
        font-size: 1.65rem;
      }
      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <main>
<h1>书名页_版权_献词</h1>
<p>灵接科技</p>
<p>月球暗面</p>
<p>李富龙 著</p>
<p>版权信息</p>
<p>书名：月球暗面</p>
<p>作者：李富龙</p>
<p>出版社：独立出版社</p>
<p>出版年份：2025-12</p>
<p>© 2025 李富龙</p>
<p>版权所有，侵权必究。</p>
<p>未经作者书面许可，不得以任何形式复制、转载或传播本书内容。</p>
<p>ISBN：978-1-xxxxxx-xx</p>
<p>仅献给努力想要知晓这个世界真相的人们......</p>
<p>——墨菲 · 卢（Morph Lune）</p>
  </main>
</body>
</html>
